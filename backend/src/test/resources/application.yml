spring:
  datasource:
    url: jdbc:h2:mem:local_life_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  flyway:
    enabled: false

management:
  health:
    rabbit:
      enabled: false

agent:
  review-sync:
    mode: direct
    max-attempts: 3

local-life:
  search:
    enabled: false
  messaging:
    enabled: false
  flash-sale:
    enabled: false
  payment:
    callback-secret: test-only-payment-callback-secret
    callback-tolerance: PT5M
    simulator-enabled: true
  rate-limit:
    enabled: false
  auth:
    issuer: local-life-backend-test
    secret: test-only-jwt-secret-that-is-at-least-thirty-two-bytes
    access-ttl: PT15M
    refresh-ttl: P30D
    refresh-store: memory
  cache:
    shop:
      enabled: false
    product:
      enabled: false
